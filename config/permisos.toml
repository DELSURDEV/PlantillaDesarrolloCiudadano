# Roles de aplicación (definidos por IT en Entra ID) -> permisos "modulo:accion".
# Un rol que no esté aquí no recibe ningún permiso (denegado por defecto).
# Al crear un módulo, agregue sus permisos al rol que corresponda. Ver AGENTS.md, sección 4.

[roles]
Usuario = ["inicio:ver"]
Administrador = ["inicio:ver"]
